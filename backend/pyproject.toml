[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aristote"
version = "0.1.0"
description = "Kiosque de tutorat socratique Aristote 4 All"
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pyserial>=3.5",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "sympy>=1.12",
]

[project.optional-dependencies]
# Sur Raspberry Pi OS, picamera2 et lgpio s'installent par apt (python3-picamera2, python3-lgpio)
# et le venv est créé avec --system-site-packages.
pi = ["gpiozero>=2.0", "sounddevice>=0.4"]
audio = ["sounddevice>=0.4"]
stt = ["faster-whisper>=1.0"]
tesseract = ["pytesseract>=0.3"]
dev = ["pytest>=8.0"]

[project.scripts]
aristote = "aristote.cli:main"

[tool.setuptools.packages.find]
include = ["aristote*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
